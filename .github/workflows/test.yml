name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 测试只依赖 Node 内置模块与 lib/timezone.js(零第三方依赖),
      # 无需 npm install,直接跑 Node 内置测试运行器。
      - name: Run tests
        run: node --test
